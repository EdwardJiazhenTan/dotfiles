# Basic settings
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g mouse on
set -g status-position top
set -gq allow-passthrough on
set -g visual-activity off
set -g default-shell $SHELL

# Change prefix from C-b to C-a
# Note: Cmd key cannot be used directly in tmux
# You'll need Karabiner to map Cmd+Tab to another key combo first
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# Split panes bindings
unbind %
bind | split-window -h
unbind '"'
bind - split-window -v

# Reload config
unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Resize panes (5 cell increments for smooth resizing)
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5
bind -r m resize-pane -Z  # Maximize/minimize pane

bind s choose-session
bind f display-popup -E "tmux list-sessions -F '#{session_name}' | fzf --reverse \
--color=fg:#d8dee9,bg:#2e3440,hl:#81a1c1 \
--color=fg+:#d8dee9,bg+:#3b4252,hl+:#81a1c1 \
--color=info:#88c0d0,prompt:#5e81ac,pointer:#bf616a \
--color=marker:#a3be8c,spinner:#b48ead,header:#81a1c1 | xargs tmux switch-client -t"

# Create new session with popup prompt for name
bind z display-popup -E -w 50% -h 20% "bash -c '\
    read -p \"New session name: \" session_name; \
    if [ -n \"\$session_name\" ]; then \
        tmux new-session -d -s \"\$session_name\" 2>/dev/null && \
        tmux switch-client -t \"\$session_name\" || \
        (echo \"Error: Session name already exists or invalid\" && sleep 2); \
    fi'"

# Create new window in current directory
bind c new-window -c "#{pane_current_path}"

bind g run-shell '\
    POPUP_INFO=$(~/dotfiles/tmux/git-aware-popup.sh "#{pane_current_path}"); \
    POPUP_DIR=$(echo "$POPUP_INFO" | cut -d"|" -f1); \
    POPUP_NAME=$(echo "$POPUP_INFO" | cut -d"|" -f2); \
    if [ "#{session_name}" = "$POPUP_NAME" ]; then \
        tmux detach-client; \
    else \
        tmux display-popup -d "$POPUP_DIR" -xC -yC -w 80% -h 75% -E "tmux attach-session -t $POPUP_NAME || tmux new-session -s $POPUP_NAME"; \
    fi \
'

bind G run-shell '\
    POPUP_NAME="popup-global"; \
    if [ "#{session_name}" = "$POPUP_NAME" ]; then \
        tmux detach-client; \
    else \
        tmux display-popup -xC -yC -w 80% -h 75% -E "tmux attach-session -t $POPUP_NAME || tmux new-session -s $POPUP_NAME"; \
    fi \
'
# Improve colors and enable focus events
set -g focus-events on
set -sg escape-time 0  # Remove delay when pressing escape (important for vim)

# Start windows and panes at 0 (can be changed to 1 to match keyboard layout)
set -g base-index 0
setw -g pane-base-index 0

# TPM plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'arcticicestudio/nord-tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Nord theme configuration
set -g @nord_tmux_no_patched_font "1"

# Continuum configuration (optional)
set -g @continuum-restore 'on'

# Initialize TPM (keep this at the bottom)
run '~/.tmux/plugins/tpm/tpm'

# Status line configuration - windows on left, session name on right
# MUST be after TPM to override Nord theme
set -g status-justify left
set -g status-left " "
set -g status-right "#[bg=#88C0D0,fg=#2E3440,bold] #S #[default]"

# Status bar styling - transparent background
set -g status-style bg=default,fg=white
set -g pane-border-status top
set -g pane-border-format ""

set -g window-status-format "#[bg=#4C566A,fg=#D8DEE9] #W(#I) #[default] "
set -g window-status-current-format "#[bg=#88C0D0,fg=#2E3440,bold] *#W(#I) #[default] "
