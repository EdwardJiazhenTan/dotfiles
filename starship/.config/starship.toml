"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

format = """$cmd_duration\
$directory\
$hostname\
$localip\
$jobs\
$sudo\
$username\
$character"""

right_format = """$git_branch\
$git_state\
$git_status\
$time"""

[character]
format = "$symbol "
success_symbol = "[>](bold bright-yellow)"
error_symbol = "[>](bold purple)"
vimcmd_symbol = "[<](bold green)"

[sudo]
format = "[$symbol]($style)"
style = "bold bright-purple"
symbol = "sudo "
disabled = false

[username]
style_user = "bright-yellow bold"
style_root = "purple bold"
format = "[$user]($style) "
disabled = false
show_always = false

[directory]
home_symbol = "~"
truncation_length = 3
truncation_symbol = ".../"
read_only = " ro"
use_os_path_sep = true
style = "italic blue"
format = '[$path]($style)[$read_only]($read_only_style) '
repo_root_style = 'bold blue'
repo_root_format = '[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) '

[cmd_duration]
format = "[$duration ](italic white)"

[jobs]
format = "[$number bg]($style) "
style = "white"

[localip]
ssh_only = true
format = "[$localipv4](bold magenta) "
disabled = false

[time]
disabled = false
format = " [$time]($style)"
time_format = "%R"
utc_time_offset = "local"
style = "italic dimmed white"

[git_branch]
format = "[$branch(:$remote_branch)]($style)"
style = "italic bright-blue"
truncation_length = 9999
only_attached = true

[git_status]
style = "bold bright-blue"
format = "([ $ahead_behind$staged$modified$untracked$renamed$deleted$conflicted$stashed]($style))"
conflicted = "[!](bold bright-magenta)"
ahead = "[+${count}](green)"
behind = "[-${count}](red)"
diverged = "[+${ahead_count} -${behind_count}](bright-magenta)"
untracked = "[?](bright-yellow)"
stashed = "[*](white)"
modified = "[~](yellow)"
staged = "[+${count}](bright-cyan)"
renamed = "[r](bright-blue)"
deleted = "[x](red)"
