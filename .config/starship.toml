"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

format = """$character"""

right_format = """$directory$time"""

[character]
format = "$symbol "
success_symbol = "[>](bold bright-yellow)"
error_symbol = "[>](bold purple)"
vimcmd_symbol = "[<](bold green)"

[sudo]
format = "[$symbol]($style)"
style = "bold bright-purple"
symbol = "sudo "
disabled = false

[username]
style_user = "bright-yellow bold"
style_root = "purple bold"
format = "[$user]($style) "
disabled = false
show_always = false

[directory]
home_symbol = "~"
truncation_length = 3
truncation_symbol = ".../"
read_only = " ro"
use_os_path_sep = true
style = "italic blue"
format = '[$path]($style)[$read_only]($read_only_style) '
repo_root_style = 'bold blue'
repo_root_format = '[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) '

[cmd_duration]
format = "[$duration ](italic white)"

[jobs]
format = "[$number bg]($style) "
style = "white"

[localip]
ssh_only = true
format = "[$localipv4](bold magenta) "
disabled = false

[time]
disabled = false
format = " [$time]($style)"
time_format = "%R"
utc_time_offset = "local"
style = "italic dimmed white"

[custom.gitdiff]
command = '''
for b in main master develop; do
  if git rev-parse --verify "origin/$b" &>/dev/null; then
    stat=$(git diff --shortstat "origin/$b"...HEAD 2>/dev/null)
    ins=$(echo "$stat" | grep -oE '[0-9]+ insertion' | grep -oE '[0-9]+')
    del=$(echo "$stat" | grep -oE '[0-9]+ deletion' | grep -oE '[0-9]+')
    [ -n "$ins" ] || ins=0
    [ -n "$del" ] || del=0
    [ "$ins" -eq 0 ] && [ "$del" -eq 0 ] && exit 0
    printf "\033[32m+%s\033[0m \033[31m-%s\033[0m" "$ins" "$del"
    exit 0
  fi
done
'''
when = "git rev-parse --is-inside-work-tree 2>/dev/null"
format = " $output "
use_stdin = false
shell = ["bash", "--nologin"]

[git_branch]
format = "[$branch(:$remote_branch)]($style)"
style = "italic bright-blue"
truncation_length = 9999
only_attached = true

[git_status]
style = "bold bright-blue"
format = "([ $ahead_behind$staged$modified$untracked$renamed$deleted$conflicted$stashed]($style))"
conflicted = "[!](bold bright-magenta)"
ahead = "[+${count}](green)"
behind = "[-${count}](red)"
diverged = "[+${ahead_count} -${behind_count}](bright-magenta)"
untracked = "[?](bright-yellow)"
stashed = "[*](white)"
modified = "[~](yellow)"
staged = "[+${count}](bright-cyan)"
renamed = "[r](bright-blue)"
deleted = "[x](red)"
