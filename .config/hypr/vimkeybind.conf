# █░█ █ █▀▄▀█   █▄▀ █▀▀ █▄█ █▄▄ █ █▄░█ █▀▄ █ █▄░█ █▀▀ █▀
# ▀▄▀ █ █░▀░█   █░█ ██▄ ░█░ █▄█ █ █░▀█ █▄▀ █ █░▀█ █▄█ ▄█

# See https://wiki.hyprland.org/Configuring/Keywords/ for reference

$mainMod = Super

# Vim-like window focus (synced with aerospace)
bind = Alt, h, movefocus, l
bind = Alt, l, movefocus, r
bind = Alt, k, movefocus, u
bind = Alt, j, movefocus, d

# Move windows in directions
bind = Alt Shift, h, movewindow, l
bind = Alt Shift, l, movewindow, r
bind = Alt Shift, k, movewindow, u
bind = Alt Shift, j, movewindow, d

# Window resizing
bind = $mainMod ALT, h, resizeactive, -30 0
bind = $mainMod ALT, l , resizeactive, 30 0
bind = $mainMod ALT, k, resizeactive, 0 -30
bind = $mainMod ALT, j, resizeactive, 0 30

# Layout management
bind = $mainMod, y, togglefloating
bind = $mainMod, f, fullscreen
bind = $mainMod, r, togglesplit

# Workspace management (Super + letter, no restrictions on Linux)
bind = $mainMod, t, workspace, name:t
bind = $mainMod, a, workspace, name:a
bind = $mainMod, m, workspace, name:m
bind = $mainMod, w, workspace, name:w
bind = $mainMod, c, workspace, name:c
bind = $mainMod, x, workspace, name:x
bind = $mainMod, p, workspace, name:p
bind = $mainMod, s, workspace, name:s
bind = $mainMod, g, workspace, name:g
bind = $mainMod, v, workspace, name:v
bind = $mainMod, d, workspace, name:d

# Move window to workspace and follow (synced with aerospace)
bind = Alt, t, movetoworkspace, name:t
bind = Alt, t, workspace, name:t
bind = Alt, a, movetoworkspace, name:a
bind = Alt, a, workspace, name:a
bind = Alt, m, movetoworkspace, name:m
bind = Alt, m, workspace, name:m
bind = Alt, w, movetoworkspace, name:w
bind = Alt, w, workspace, name:w
bind = Alt, c, movetoworkspace, name:c
bind = Alt, c, workspace, name:c
bind = Alt, x, movetoworkspace, name:x
bind = Alt, x, workspace, name:x
bind = Alt, p, movetoworkspace, name:p
bind = Alt, p, workspace, name:p
bind = Alt, s, movetoworkspace, name:s
bind = Alt, s, workspace, name:s
bind = Alt, g, movetoworkspace, name:g
bind = Alt, g, workspace, name:g
bind = Alt, v, movetoworkspace, name:v
bind = Alt, v, workspace, name:v
bind = Alt, d, movetoworkspace, name:d
bind = Alt, d, workspace, name:d

# Move workspace to next monitor (synced with aerospace)
bind = Alt Shift, t, movecurrentworkspacetomonitor, +1
bind = Alt Shift, a, movecurrentworkspacetomonitor, +1
bind = Alt Shift, m, movecurrentworkspacetomonitor, +1
bind = Alt Shift, w, movecurrentworkspacetomonitor, +1
bind = Alt Shift, c, movecurrentworkspacetomonitor, +1
bind = Alt Shift, x, movecurrentworkspacetomonitor, +1
bind = Alt Shift, p, movecurrentworkspacetomonitor, +1
bind = Alt Shift, s, movecurrentworkspacetomonitor, +1
bind = Alt Shift, g, movecurrentworkspacetomonitor, +1
bind = Alt Shift, v, movecurrentworkspacetomonitor, +1
bind = Alt Shift, d, movecurrentworkspacetomonitor, +1

# Group navigation
bind = $mainMod, tab, changegroupactive, f
bind = $mainMod SHIFT, tab, changegroupactive, b

