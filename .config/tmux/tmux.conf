# Basic settings
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# enable mouse
set -g mouse on
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear

set -g status-position bottom
set -gq allow-passthrough on
set -g visual-activity off

# Change prefix from C-b to C-f
set -g prefix C-f
unbind C-b
bind-key C-f send-prefix

# Split panes bindings
unbind %
bind | split-window -h
unbind '"'
bind - split-window -v

# Reload config
unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Resize panes (5 cell increments for smooth resizing)
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5
bind -r m resize-pane -Z  # Maximize/minimize pane

bind s choose-session
bind c new-window

# Improve colors and enable focus events
set -g focus-events on
set -sg escape-time 0

set -g base-index 0
setw -g pane-base-index 0

# Status bar - Nord-inspired, transparent
set -g status-style "bg=default"
set -g status-interval 5
set -g status-justify absolute-centre

# Left: session name
set -g status-left-length 50
set -g status-left "#[fg=#88c0d0,bold] #S "

# Middle: window list
setw -g window-status-format "#[fg=#4c566a] #I:#W "
setw -g window-status-current-format "#[fg=#88c0d0]│#[fg=#eceff4,bold] #I:#W #[fg=#88c0d0]│"

# Right: git branch
set -g status-right-length 60
set -g status-right "#[fg=#a3be8c]#{?#{!=:#(cd #{pane_current_path} && git rev-parse --abbrev-ref HEAD 2>/dev/null),}, #(cd #{pane_current_path} && git rev-parse --abbrev-ref HEAD 2>/dev/null),} "

# Pane borders - subtle
set -g pane-border-style "fg=#3b4252"
set -g pane-active-border-style "fg=#88c0d0"

# Message style
set -g message-style "fg=#d8dee9,bg=#3b4252"

# TPM plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Continuum configuration
set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
