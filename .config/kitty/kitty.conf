font_family      JetBrainsMono NFM SemiBold 
bold_font        auto
italic_font      auto
bold_italic_font auto
enable_audio_bell no
window_alert_on_bell no
font_size 14
include theme.conf
hide_window_decorations titlebar-only
allow_remote_control yes

background_opacity 1
dynamic_background_opacity yes
window_padding_width 10 10 10 10
modify_font cell_height 1.30 # "comfortable" line height

macos_show_window_title_in none
macos_titlebar_color background

draw_minimal_borders yes
window_border_width 3pt
active_border_color #88C0D0
inactive_border_color #4C566A

# Forward modified keys through tmux/opencode.
map shift+enter send_text all \x1b[13;2u
